[project]
name = "pronote-cli"
version = "0.1.3"
description = "Local sync of Pronote data (grades, homework, lessons, teachers, absences) into SQLite. The CLI binary is `cartable` for backwards compatibility with the umbrella project."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sizyph" }]
requires-python = ">=3.10"
keywords = ["pronote", "school", "sqlite", "claude", "claude-code"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
]
dependencies = [
    "pronotepy>=2.14.6",
    "python-dotenv>=1.2.2",
]

[project.scripts]
cartable = "pronote_cli.cli:main"

[project.urls]
Repository = "https://github.com/Sizyph/cartable"
Issues = "https://github.com/Sizyph/cartable/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pronote_cli"]
