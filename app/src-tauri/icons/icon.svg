<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cartable app icon — a stylised Japanese randoseru school bag in
  Pronote-blue, with a subtle gold clasp and a soft inner shine.
  Designed for the macOS 1024×1024 icon target.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" shape-rendering="geometricPrecision">
  <!-- ============== gradients ============== -->
  <defs>
    <!-- Background: deep navy → Pronote-blue, radial -->
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%"   stop-color="#3a7bd5"/>
      <stop offset="55%"  stop-color="#1d4f9f"/>
      <stop offset="100%" stop-color="#0b1f44"/>
    </radialGradient>

    <!-- Bag body: lighter blue with a vertical sheen -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5fa0ff"/>
      <stop offset="40%"  stop-color="#2f6fd8"/>
      <stop offset="100%" stop-color="#1a3f86"/>
    </linearGradient>

    <!-- Flap: slightly brighter than body so it catches light -->
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7ebbff"/>
      <stop offset="55%"  stop-color="#3678e0"/>
      <stop offset="100%" stop-color="#1a3f86"/>
    </linearGradient>

    <!-- Gold for the clasp -->
    <radialGradient id="gold" cx="50%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#ffe69a"/>
      <stop offset="55%"  stop-color="#e9b73d"/>
      <stop offset="100%" stop-color="#8a5e0a"/>
    </radialGradient>

    <!-- Sheen: white → transparent for the highlight blobs -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft inner glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="atop"/>
    </filter>

    <!-- Drop shadow filter for the bag -->
    <filter id="dropshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="22" result="off"/>
      <feFlood flood-color="#000000" flood-opacity="0.55"/>
      <feComposite in2="off" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Rounded-square mask for the macOS icon shape -->
    <clipPath id="appMask">
      <rect x="64" y="64" width="896" height="896" rx="200" ry="200"/>
    </clipPath>
  </defs>

  <!-- ============== background ============== -->
  <g clip-path="url(#appMask)">
    <rect x="64" y="64" width="896" height="896" fill="url(#bg)"/>

    <!-- Faint diagonal sheen behind the bag -->
    <polygon points="64,64 960,64 720,960 64,960" fill="#ffffff" opacity="0.04"/>

    <!-- Subtle far-back glow halo behind the bag -->
    <ellipse cx="512" cy="540" rx="340" ry="280" fill="#7ec3ff" opacity="0.18" filter="url(#glow)"/>

    <!-- ============== shoulder straps (top, peeking) ============== -->
    <g fill="#162a55">
      <path d="M 310 200
               Q 295 280 305 360
               L 360 360
               Q 355 285 370 200 Z"/>
      <path d="M 714 200
               Q 729 280 719 360
               L 664 360
               Q 669 285 654 200 Z"/>
    </g>

    <!-- ============== top handle ============== -->
    <g>
      <path d="M 470 215 Q 512 175 554 215 L 554 252 Q 512 220 470 252 Z"
            fill="#0e1e44"/>
      <!-- handle highlight -->
      <path d="M 482 220 Q 512 192 542 220" fill="none"
            stroke="#5b88d9" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    </g>

    <!-- ============== bag body ============== -->
    <g filter="url(#dropshadow)">
      <!-- main body -->
      <rect x="232" y="320" width="560" height="560" rx="48" ry="48" fill="url(#body)"/>

      <!-- bottom seam -->
      <line x1="252" y1="836" x2="772" y2="836" stroke="#0c224d" stroke-width="3" opacity="0.6"/>

      <!-- side gusset hints -->
      <line x1="262" y1="340" x2="262" y2="860" stroke="#0c224d" stroke-width="3" opacity="0.35"/>
      <line x1="762" y1="340" x2="762" y2="860" stroke="#0c224d" stroke-width="3" opacity="0.35"/>

      <!-- ============== top flap ============== -->
      <path d="M 232 360
               L 792 360
               L 792 640
               Q 792 668 770 668
               L 254 668
               Q 232 668 232 640 Z"
            fill="url(#flap)"/>

      <!-- flap bottom shadow line -->
      <path d="M 232 660 L 792 660" stroke="#0c224d" stroke-width="3" opacity="0.55"/>

      <!-- ============== clasp strap descending from flap ============== -->
      <rect x="486" y="600" width="52" height="160" rx="10" fill="#1a3370"/>
      <!-- subtle strap highlight -->
      <rect x="494" y="610" width="8"  height="140" fill="#3f6fc4" opacity="0.7"/>

      <!-- gold buckle -->
      <g>
        <circle cx="512" cy="720" r="44" fill="url(#gold)"/>
        <circle cx="512" cy="720" r="44" fill="none" stroke="#5a3b00" stroke-width="3" opacity="0.6"/>
        <!-- buckle inner ring -->
        <circle cx="512" cy="720" r="22" fill="none" stroke="#7a5410" stroke-width="3"/>
        <!-- buckle highlight -->
        <ellipse cx="500" cy="708" rx="14" ry="7" fill="#fff5d8" opacity="0.7"/>
      </g>

      <!-- ============== flap embossed emblem (subtle "C") ============== -->
      <g opacity="0.45" transform="translate(440 420)">
        <circle cx="72" cy="72" r="70" fill="none" stroke="#0c224d" stroke-width="6"/>
        <path d="M 122 36
                 A 56 56 0 1 0 122 108"
              fill="none" stroke="#cfe1ff" stroke-width="10" stroke-linecap="round"/>
      </g>

      <!-- ============== top-left shine ============== -->
      <path d="M 232 360
               L 540 360
               L 480 510
               L 232 510 Z"
            fill="url(#sheen)" opacity="0.45"/>
      <!-- bottom-right warm reflection -->
      <ellipse cx="700" cy="800" rx="80" ry="20" fill="#ffffff" opacity="0.07"/>

      <!-- small rivets on the flap corners -->
      <circle cx="280" cy="412" r="6" fill="#0c224d"/>
      <circle cx="744" cy="412" r="6" fill="#0c224d"/>
    </g>

    <!-- ============== overall radial "mysterious" vignette ============== -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <rect x="64" y="64" width="896" height="896" fill="url(#vignette)"/>

    <!-- tiny "shining stars" sparkles -->
    <g fill="#ffffff" opacity="0.85">
      <circle cx="200" cy="180" r="2.5"/>
      <circle cx="840" cy="280" r="3"/>
      <circle cx="160" cy="700" r="2"/>
      <circle cx="880" cy="780" r="2.5"/>
      <circle cx="600" cy="160" r="2"/>
    </g>
  </g>
</svg>
