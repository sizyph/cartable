[package]
name = "cartable-app"
version = "0.1.2"
description = "Cartable — local Mac app for Pronote data."
authors = ["Sizyph"]
edition = "2021"

[lib]
# The `_lib` suffix is necessary to make the lib name unique vs the bin.
name = "cartable_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true
