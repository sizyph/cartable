[project]
name = "cartable-app-backend"
version = "0.1.3"
description = "Local HTTP backend for the Cartable Mac app — reads cartable's SQLite, exposes typed queries, hosts the Claude agent and the Google Calendar sync."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.82",
    "fastapi>=0.136.1",
    "google-api-python-client>=2.196.0",
    "google-auth>=2.53.0",
    "google-auth-oauthlib>=1.4.0",
    "keyring>=25.7.0",
    "pronote-cli",  # source: tool.uv.sources below — local path to the umbrella CLI
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "uvicorn[standard]>=0.47.0",
]

[tool.uv.sources]
pronote-cli = { path = "../..", editable = true }

[project.scripts]
cartable-app-backend = "cartable_app_backend.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartable_app_backend"]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
