name: Release Cartable.app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to publish under (only for manual runs)"
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write

jobs:
  build:
    name: Build macOS (arm64) bundle
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # ---- toolchains -------------------------------------------------------
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # ---- backend: pyinstaller single-file binary --------------------------
      - name: Sync backend deps
        working-directory: app/backend
        run: uv sync

      - name: Build cartable-app-backend (PyInstaller)
        working-directory: app/backend
        run: |
          uv run pyinstaller \
            --onefile --noconfirm \
            --name cartable-app-backend-aarch64-apple-darwin \
            --collect-all uvicorn \
            --collect-all fastapi \
            --collect-all pydantic \
            --collect-all pydantic_core \
            --collect-all starlette \
            --collect-all anyio \
            --collect-all watchfiles \
            --collect-all httptools \
            --collect-all uvloop \
            --collect-all websockets \
            --collect-all multipart \
            --collect-all google \
            --collect-all googleapiclient \
            --collect-all google_auth_oauthlib \
            --collect-all claude_agent_sdk \
            --collect-all pronotepy \
            --collect-submodules cartable_app_backend \
            src/cartable_app_backend/__main__.py
          mkdir -p ../src-tauri/binaries
          cp dist/cartable-app-backend-aarch64-apple-darwin ../src-tauri/binaries/

      # ---- frontend ---------------------------------------------------------
      - name: Install frontend deps
        working-directory: app
        run: npm ci

      # ---- tauri build (.app only — DMG is rebuilt below after signing) -----
      - name: Build Cartable.app
        working-directory: app
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app

      # ---- re-sign the .app properly --------------------------------------
      #
      # Tauri's linker only adhoc-signs the main binary; the bundle's
      # _CodeSignature ends up missing sealed resources, which makes macOS
      # reject the .app outright ("damaged"). A full deep adhoc sign fixes
      # this — Gatekeeper still warns on first launch (no Developer ID),
      # but right-click → Open then works. v0.1.0 shipped without this step
      # and was un-installable; see commit history for details.
      - name: Adhoc-sign .app (deep)
        run: |
          APP=app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Cartable.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # ---- DMG with proper drag-and-drop layout via create-dmg ------------
      - name: Build DMG (create-dmg, drag-and-drop layout)
        run: |
          APP=app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Cartable.app
          OUT_DMG="Cartable-${{ github.ref_name }}-arm64.dmg"

          # `create-dmg` is sindresorhus's npm CLI — produces the classic
          # window with the .app on the left and an Applications symlink
          # on the right, ready to drag.
          npm install --no-save create-dmg
          npx create-dmg --overwrite --identity= "$APP" .

          # create-dmg names the output "<Name> <Version>.dmg"; normalise it.
          shopt -s nullglob
          for f in Cartable*.dmg; do
            mv "$f" "$OUT_DMG"
            break
          done
          ls -lh "$OUT_DMG"

      # ---- collect artefacts ---------------------------------------------
      - name: Stage release assets
        id: stage
        run: |
          set -e
          mkdir -p out
          APP=app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Cartable.app
          ( cd "$(dirname "$APP")" && zip -ryq "$GITHUB_WORKSPACE/out/Cartable-${{ github.ref_name }}-arm64.app.zip" Cartable.app )
          mv "Cartable-${{ github.ref_name }}-arm64.dmg" out/
          ls -la out
          echo "asset_dir=out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cartable-macos-arm64
          path: ${{ steps.stage.outputs.asset_dir }}/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.stage.outputs.asset_dir }}/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **Cartable.app for macOS (Apple Silicon).**

            Install:
            1. Download `Cartable-*-arm64.dmg`, double-click to mount.
            2. Drag **Cartable** onto **Applications**.
            3. On first launch, macOS Gatekeeper will refuse to open the unsigned app.
               Right-click → **Open** the first time to bypass, or in Terminal:
               `xattr -d com.apple.quarantine /Applications/Cartable.app`.

            The bundle is adhoc-signed but not notarised — Cartable doesn't have an
            Apple Developer ID. Everything runs locally; nothing is sent to Apple.
